<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    
    <header>
        <h1>My Personal Website</h1>
        <p>Welcome to my personal student Portal</p>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="registration.html">Registration</a>
        <a href="grades.html">Grades</a>
        <a href="profile.html">Profile</a>
    </nav>


        <section>

        <div class="forms">
        <h2>Student Registration Form</h2>
        <br>

            <form>
                <label for="username">username:</label>
                <input type="text" id="username" placeholder="Enter username" minlength="4" maxlength="8" required>
                <br>
                <br>
                <label for="password">password:</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="6" maxlength="8" required>
                <br>
                <br>
                <label for="email">email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <br>
                <br>
                <label for="phone">phone:</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
                <br>
                <br>
                <label for="bday">birth date:</label>
                <input type="date" id="bday" required>
                <br>
                <br>
                <label for="gender">Gender:</label>
                <br>
                <br>
                <label for="Male">Male:</label>
                <input type="radio" id="Male" value="Male" name="gender" required>
                <label for="Female">Female:</label>
                <input type="radio" id="Female" value="Female" name="gender" required>
                <br>
                <br>
                <label for="course" >Course:</label>
                
                <select placeholder="Select your course">
                    
                    <option value="IT">Information Technology</option>
                    <option value="TM">Tourism Management</option>
                    <option value="CS">Computer Science</option>
                </select>
                <br>
                <br>
                <label for="skills">Skills:</label>
                <br>
                <br>
                <label for="html">Html</label>
                <input type="checkbox" id="html" required><br>
                <label for="css">Css</label>
                <input type="checkbox" id="css" required><br>
                <label for="js">JavaScript</label>
                <input type="checkbox" id="js" required>
                <br>
                <br>
                <label for="address">Address</label>
                <textarea id="address" placeholder="Enter your address" rows="4" cols="50" required ></textarea>
                <br>
                <br>
                <label for="file">File:</label>
                <input type="file" id="file" accept="image/png, image/jpeg" required>
                <br>
                <br>
                <input type="reset">
                <input type="submit">
            </form>

        </div>

        </section>
    
 

    <footer>
        <p>&copy; 2026 My Personal Website. All rights reserved.</p>
    </footer>
    
   
</body>
</html>
